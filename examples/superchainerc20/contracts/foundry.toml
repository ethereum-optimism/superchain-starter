[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
cache_path = "cache"
broadcast = "broadcast"
libs = ["../../../contracts/lib"]

remappings = [
  "@interop-lib/=../../../contracts/lib/interop-lib/src/",
  "forge-std/=../../../contracts/lib/forge-std/src/",
  "@solady/=../../../contracts/lib/solady/src/"
]

